name: dist

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API, or automatically after a manually-triggered `build` run succeeds.
on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      release_tag:
        description: 'Release tag to publish to (e.g. v88). Leave empty to auto-derive the next v(N+1).'
        # Default value if no value is explicitly provided
        default: ''
        # Optional: when empty the tag is auto-derived from existing releases
        required: false
      test:
        # test only
        description: 'Whether test only'
        # Default value if no value is explicitly provided
        default: ''
        # Input has to be provided for the workflow to run
        required: false
      package_suffix:
        description: 'Please specific dist package suffix'
        # Default value if no value is explicitly provided
        default: ''
        # Input has to be provided for the workflow to run
        required: false
      run_id:
        description: 'Please specific run id'
        # Default value if no value is explicitly provided
        default: ''
        # Input has to be provided for the workflow to run
        required: false
      libs:
        description: "dist libs, split by ','"
        default: ''
        required: false
      
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  dist:
    # The type of runner that the job will run on
    runs-on: macos-latest
    # softprops/action-gh-release needs write access to create/update the release
    permissions:
      contents: write
    # Run when: (a) triggered by a *manually-dispatched* build that succeeded, or
    # (b) this workflow is dispatched manually (with a release_tag or in test mode).
    if: >-
      ${{ (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'workflow_dispatch')
          || github.event.inputs.release_tag != ''
          || github.event.inputs.test != '' }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    - uses: actions/checkout@v6
    
    - name: Download artifacts from workflow build
      uses: dawidd6/action-download-artifact@v11
      with:
        # Optional, GitHub token
        github_token: ${{secrets.GITHUB_TOKEN}}
        # Required, workflow file name or ID
        workflow: build.yml
        workflow_conclusion: success
        # Auto-triggered: pull artifacts from the exact build run that triggered
        # us; manual dispatch: use the run_id input (empty = latest successful).
        run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.run_id }}

    - name: Determine release tag name
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Priority: explicit manual input wins; otherwise (auto-triggered) derive
        # the next tag as v(N+1) from the highest existing vN release. A failed
        # dist never creates a release, so a failed run leaves the number free and
        # the next attempt reuses it — i.e. the counter only advances on success.
        RELEASE_TAG_NAME="${{ github.event.inputs.release_tag }}"
        if [ -z "$RELEASE_TAG_NAME" ]; then
          latest=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
                   | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -1)
          if [ -z "$latest" ]; then latest=0; fi
          RELEASE_TAG_NAME="v$((latest + 1))"
        fi
        echo "RELEASE_TAG_NAME=$RELEASE_TAG_NAME" >> $GITHUB_ENV
        echo "Resolved release tag: $RELEASE_TAG_NAME"

    - name: Prepare dist package
      run: |
        ls
        source 1k/dist.sh $RELEASE_TAG_NAME '${{github.event.inputs.package_suffix}}' '${{github.event.inputs.libs}}'
        ls

    - name: Upload dist package to release page
      if: ${{ env.RELEASE_TAG_NAME != '' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG_NAME }}
        name: ${{ env.RELEASE_TAG_NAME }}
        body_path: ${{ env.DIST_NOTES }}
        files: |
          ./seprate/*.zip
          ./seprate/*.7z
          ${{ env.DIST_VERLIST }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: JumTT/1kiss
